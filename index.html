  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="manifest" href="manifest.json">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BadmintonPro">
  <meta name="theme-color" content="#16a34a">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="score.js"></script>
  <script src="round.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#16a34a',
            accent: '#f59e0b',
          }
        }
      }
    }

  <style>
    body { background: #0f172a; font-family: 'Segoe UI', system-ui, sans-serif; }
    .star-active { color: #f59e0b; }
    .star-inactive { color: #374151; }
    .court-gradient { background: linear-gradient(135deg, #14532d 0%, #166534 50%, #14532d 100%); }
    .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    .pulse-win { animation: pulseGreen 0.6s ease-in-out; }
    @keyframes pulseGreen { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
    .badge { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:9999px; font-size:12px; font-weight:600; }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #374151; border-radius: 2px; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

// ─── Types (as JSDoc) ───────────────────────────────────────────────────────
// Player: { id, name, rating, sessionPoints, wins, roundsPlayed, roundsOnBench, lastRoundBenched }
// Match: { courtIndex, teamA:[id,id], teamB:[id,id], winner:null|'A'|'B' }
// Round: { matches:[], bench:[] }

// ─── Utilities ──────────────────────────────────────────────────────────────
const uid = () => `p${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;

// pairKey, bestSplit, generateRound live in round.js (loaded above) so the
// round-generation logic can be unit tested with plain node.

// Composite skill score used for adaptive matchups (round 2+)
// Blends session points, win%, and score differential
function adaptiveScore(p) {
  const winPct = p.roundsPlayed > 0 ? p.wins / p.roundsPlayed : 0;
  const pointDiff = p.roundsPlayed > 0 ? ((p.pointsScored ?? 0) - (p.pointsAgainst ?? 0)) / p.roundsPlayed : 0;
  // 50% points, 30% win%, 20% normalised score diff
  return p.sessionPoints * 0.5 + winPct * 20 * 0.3 + pointDiff * 0.2;
}

function applyResults(playerMap, round) {
  const updated = { ...playerMap };
  for (const match of round.matches) {
    if (!match.winner) continue;
    const winners = match.winner === 'A' ? match.teamA : match.teamB;
    const losers  = match.winner === 'A' ? match.teamB : match.teamA;
    const wScore  = match.winner === 'A' ? (match.scoreA ?? 0) : (match.scoreB ?? 0);
    const lScore  = match.winner === 'A' ? (match.scoreB ?? 0) : (match.scoreA ?? 0);
    const margin  = wScore - lScore;

    const winnerRating = winners.reduce((s,id) => s + updated[id].rating, 0) / 2;
    const loserRating  = losers.reduce((s,id) => s + updated[id].rating, 0) / 2;
    const upset = winnerRating < loserRating;

    // Base points: 3 for upset win, 2 for normal win; +1 bonus per 5-pt margin
    const winPts = (upset ? 3 : 2) + Math.floor(margin / 5);

    winners.forEach(id => {
      const p = updated[id];
      updated[id] = { ...p, wins: p.wins + 1, sessionPoints: p.sessionPoints + winPts,
        roundsPlayed: p.roundsPlayed + 1, pointsScored: p.pointsScored + wScore, pointsAgainst: p.pointsAgainst + lScore };
    });
    losers.forEach(id => {
      const p = updated[id];
      updated[id] = { ...p, sessionPoints: p.sessionPoints + 1,
        roundsPlayed: p.roundsPlayed + 1, pointsScored: p.pointsScored + lScore, pointsAgainst: p.pointsAgainst + wScore };
    });
  }
  round.bench.forEach(id => {
    updated[id] = { ...updated[id], roundsOnBench: updated[id].roundsOnBench + 1 };
  });
  return updated;
}

// ─── StarRating Component ───────────────────────────────────────────────────
function StarRating({ value, onChange, size = 'md' }) {
  const sz = size === 'sm' ? 'text-lg' : 'text-2xl';
  return (
    <div className="flex gap-1">
      {[1,2,3,4,5].map(s => (
        <button key={s} type="button" onClick={() => onChange && onChange(s)}
          className={`${sz} transition-transform hover:scale-125 ${s <= value ? 'star-active' : 'star-inactive'} ${onChange ? 'cursor-pointer' : 'cursor-default'}`}>
          ★
        </button>
      ))}
    </div>
  );
}

// ─── Setup Screen ───────────────────────────────────────────────────────────
function ConfirmDialog({ title, message, confirmLabel, onConfirm, onCancel }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: 'rgba(0,0,0,0.7)' }}>
      <div className="glass rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl">
        <div className="px-5 py-4 border-b border-slate-700">
          <h2 className="font-bold text-lg text-white">{title}</h2>
        </div>
        <div className="px-5 py-4">
          <p className="text-slate-300 text-sm leading-relaxed">{message}</p>
        </div>
        <div className="px-5 py-4 border-t border-slate-700 flex gap-3">
          <button type="button" onClick={onCancel}
            className="flex-1 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold transition-colors">
            No
          </button>
          <button type="button" onClick={onConfirm}
            className="flex-1 py-2.5 rounded-xl bg-red-500 hover:bg-red-400 text-white font-semibold transition-colors">
            {confirmLabel || 'Yes'}
          </button>
        </div>
      </div>
    </div>
  );
}

function WhoBar({ userName, online, onLogout }) {
  return (
    <div className="max-w-2xl mx-auto mb-4 flex items-center justify-between gap-3 text-sm">
      <div className="text-slate-400 truncate">
        <span className="text-white font-semibold">{userName}</span>
        {online && online.length > 0 && (
          <span className="ml-2">· online {online.join(', ')}</span>
        )}
      </div>
      <button type="button" onClick={onLogout} className="text-slate-400 hover:text-white shrink-0">Log out</button>
    </div>
  );
}

function Setup({ courts, scoreTarget, players, roster, onPatch, onRoster, onStart, userName, online, onLogout }) {
  const [name, setName] = useState('');
  const [rating, setRating] = useState(3);
  const [pendingDelete, setPendingDelete] = useState(null);
  const [expandedHistoryId, setExpandedHistoryId] = useState(null);

  const minPlayers = 4;
  const canStart = players.length >= minPlayers;
  const tonightIds = new Set(players.map(p => p.id));

  const addPlayer = async () => {
    if (!name.trim()) return;
    const result = await onRoster({ action: 'add', name: name.trim(), rating });
    if (!result || !result.ok) return;
    const saved = result.player;
    if (!tonightIds.has(saved.id)) {
      onPatch(s => ({ players: [...(s.players || []), sessionPlayerFromRoster(saved)] }));
    }
    setName('');
    setRating(3);
  };

  const addToTonight = (saved) => {
    if (tonightIds.has(saved.id)) return;
    onPatch(s => ({ players: [...(s.players || []), sessionPlayerFromRoster(saved)] }));
  };

  const removeFromTonight = (id) => onPatch(s => ({ players: (s.players || []).filter(x => x.id !== id) }));

  const updateSavedRating = async (id, nextRating) => {
    const result = await onRoster({ action: 'update', id, rating: nextRating });
    if (!result || !result.ok) return;
    if (tonightIds.has(id)) {
      onPatch(s => ({
        players: (s.players || []).map(p => p.id === id ? { ...p, rating: nextRating } : p),
      }));
    }
  };

  const removeSaved = async (saved) => {
    const result = await onRoster({ action: 'remove', id: saved.id });
    if (!result || !result.ok) return;
    if (tonightIds.has(saved.id)) removeFromTonight(saved.id);
    setPendingDelete(null);
  };

  const addAllSaved = () => {
    const missing = roster.filter(r => !tonightIds.has(r.id));
    if (!missing.length) return;
    onPatch(s => ({ players: [...(s.players || []), ...missing.map(sessionPlayerFromRoster)] }));
  };

  const handleKey = (e) => { if (e.key === 'Enter') addPlayer(); };

  return (
    <div className="min-h-screen text-white p-4 md:p-8">
      {pendingDelete && (
        <ConfirmDialog
          title="Delete saved player?"
          message={`Remove ${pendingDelete.name} from the Saved Club Roster? This cannot be undone.`}
          confirmLabel="Yes, delete"
          onConfirm={() => removeSaved(pendingDelete)}
          onCancel={() => setPendingDelete(null)}
        />
      )}
      {/* Header */}
      <div className="text-center mb-10">
        <div className="text-5xl mb-3">🏸</div>
        <h1 className="text-4xl font-black tracking-tight text-green-400">BadmintonPro</h1>
        <p className="text-slate-400 mt-2">Men's doubles · smart matchups for competitive sessions</p>
      </div>

      <WhoBar userName={userName} online={online} onLogout={onLogout} />

      <div className="max-w-2xl mx-auto space-y-6">
        {/* Court Count */}
        <div className="glass rounded-2xl p-6">
          <h2 className="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">
            <span>🏟️</span> Number of Courts
          </h2>
          <div className="flex gap-3">
            {[1,2,3].map(c => (
              <button key={c} onClick={() => onPatch({ courts: c })}
                className={`flex-1 py-4 rounded-xl text-2xl font-black transition-all ${courts === c ? 'bg-green-500 text-white shadow-lg shadow-green-500/30 scale-105' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}>
                {c}
                <div className="text-xs font-normal mt-1">{c === 1 ? 'Solo' : c === 2 ? 'Duo' : 'Triple'}</div>
              </button>
            ))}
          </div>
          <p className="text-slate-400 text-sm mt-3 text-center">Minimum 4 players required · extras sit on bench · courts used based on player count</p>
        </div>

        {/* Score format */}
        <div className="glass rounded-2xl p-6">
          <h2 className="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">
            <span>🎯</span> Game Format
          </h2>
          <div className="flex gap-3">
            {[15, 21].map(n => (
              <button key={n} type="button" onClick={() => onPatch({ scoreTarget: n })}
                className={`flex-1 py-4 rounded-xl text-2xl font-black transition-all ${scoreTarget === n ? 'bg-green-500 text-white shadow-lg shadow-green-500/30 scale-105' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}>
                {n}
                <div className="text-xs font-normal mt-1">First to {n}</div>
              </button>
            ))}
          </div>
          <p className="text-slate-400 text-sm mt-3 text-center">No win-by-2 · stop early and the leading score wins · points follow the recorded score</p>
        </div>

        {/* Save player */}
        <div className="glass rounded-2xl p-6">
          <h2 className="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">
            <span>💾</span> Save Player
          </h2>
          <div className="space-y-4">
            <input
              value={name} onChange={e => setName(e.target.value)} onKeyDown={handleKey}
              placeholder="Player name..."
              className="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500"
            />
            <div className="flex items-center justify-between">
              <div>
                <div className="text-sm text-slate-400 mb-1">Skill Rating</div>
                <StarRating value={rating} onChange={setRating} />
              </div>
              <button onClick={addPlayer} disabled={!name.trim()}
                className="bg-green-500 hover:bg-green-400 disabled:bg-slate-600 disabled:cursor-not-allowed text-white font-bold py-3 px-6 rounded-xl transition-all active:scale-95">
                Save & Add Tonight
              </button>
            </div>
          </div>
          <p className="text-slate-500 text-xs mt-3">Saved to the club roster with skill rating and point history. Persists across sessions.</p>
        </div>

        {/* Saved club roster */}
        {roster.length > 0 && (
          <div className="glass rounded-2xl p-6">
            <div className="flex items-center gap-2 mb-4">
              <h2 className="text-lg font-bold text-slate-200 flex items-center gap-2">
                <span>📁</span> Saved Club Roster
              </h2>
              <span className="badge bg-slate-600/40 text-slate-300 ml-auto">{roster.length} saved</span>
            </div>
            <div className="space-y-2 max-h-80 overflow-y-auto scrollbar-thin pr-1">
              {roster.map((p) => {
                const history = p.history || [];
                const hasHistory = history.length > 0;
                const expanded = expandedHistoryId === p.id;
                return (
                <div key={p.id} className="bg-slate-700/50 rounded-xl px-4 py-2.5 gap-2">
                  <div className="flex items-center justify-between gap-2">
                    <div className="min-w-0 flex-1">
                      <span className="font-semibold truncate block">{p.name}</span>
                      <div className="flex items-center gap-2 mt-0.5 flex-wrap">
                        <span className="text-xs text-green-400 font-semibold">{p.totalPoints || 0} pts total</span>
                        {(p.sessionsPlayed || 0) > 0 && (
                          <span className="text-xs text-slate-400">{p.sessionsPlayed} session{p.sessionsPlayed === 1 ? '' : 's'}</span>
                        )}
                        {hasHistory && (
                          <button type="button" onClick={() => setExpandedHistoryId(expanded ? null : p.id)}
                            className="text-xs text-slate-400 hover:text-slate-200 underline">
                            {expanded ? 'Hide history' : 'Show history'}
                          </button>
                        )}
                      </div>
                    </div>
                    <div className="flex items-center gap-2 shrink-0">
                      <StarRating value={p.rating} onChange={(v) => updateSavedRating(p.id, v)} size="sm" />
                      {!tonightIds.has(p.id) ? (
                        <button type="button" onClick={() => addToTonight(p)} className="text-xs bg-green-500/20 text-green-400 hover:bg-green-500/30 px-2 py-1 rounded-lg font-semibold">+ Tonight</button>
                      ) : (
                        <span className="text-xs bg-slate-600/40 text-slate-400 px-2 py-1 rounded-lg font-semibold">Tonight</span>
                      )}
                      <button type="button" onClick={() => setPendingDelete(p)} title={`Remove ${p.name} from saved roster`}
                        className="text-xs bg-red-500/15 text-red-400 hover:bg-red-500/25 px-2 py-1 rounded-lg font-semibold transition-colors">
                        Delete
                      </button>
                    </div>
                  </div>
                  {expanded && hasHistory && (
                    <div className="mt-2 pt-2 border-t border-slate-600/60 space-y-1.5">
                      {history.map((h, i) => (
                        <div key={`${p.id}-${h.date}-${i}`} className="flex items-center justify-between text-xs">
                          <span className="text-slate-400">{h.date}</span>
                          <span className="text-green-400 font-semibold">{h.sessionPoints} pts</span>
                          <span className="text-slate-500">{h.wins}W · {h.roundsPlayed}G</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );})}
            </div>
          </div>
        )}

        {/* Tonight's lineup */}
        {players.length > 0 && (
          <div className="glass rounded-2xl p-6">
            <h2 className="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">
              <span>📋</span> Tonight's Lineup
              <span className={`ml-auto badge ${players.length >= minPlayers ? 'bg-green-500/20 text-green-400' : 'bg-amber-500/20 text-amber-400'}`}>
                {players.length}/{minPlayers}+ players
              </span>
            </h2>
            {roster.length > players.length && (
              <button type="button" onClick={addAllSaved}
                className="mb-3 w-full py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-semibold">
                Add all saved players to tonight
              </button>
            )}
            <div className="space-y-2 max-h-64 overflow-y-auto scrollbar-thin pr-1">
              {players.map((p, i) => (
                <div key={p.id} className="flex items-center justify-between bg-slate-700/50 rounded-xl px-4 py-2.5">
                  <div className="flex items-center gap-3">
                    <span className="text-slate-500 text-sm w-5 text-right">{i + 1}</span>
                    <span className="font-semibold">{p.name}</span>
                  </div>
                  <div className="flex items-center gap-3">
                    <StarRating value={p.rating} size="sm" />
                    <button onClick={() => removeFromTonight(p.id)} className="text-slate-500 hover:text-red-400 transition-colors text-lg leading-none" title="Remove from tonight">×</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Start Button */}
        <button
          onClick={onStart}
          disabled={!canStart}
          className="w-full py-4 rounded-2xl text-lg font-black transition-all
            disabled:bg-slate-700 disabled:text-slate-500 disabled:cursor-not-allowed
            bg-gradient-to-r from-green-500 to-emerald-400 text-white shadow-lg shadow-green-500/30 hover:shadow-green-500/50 hover:scale-[1.02] active:scale-[0.98]">
          {canStart ? `🚀 Start Men's Doubles · to ${scoreTarget} · ${players.length} players · up to ${Math.min(courts, Math.floor(players.length / 4))} court${Math.min(courts, Math.floor(players.length / 4)) !== 1 ? 's' : ''}` : `Need at least 4 players to start`}
        </button>
      </div>
    </div>
  );
}

// ─── CourtCard Component ─────────────────────────────────────────────────────
function CourtCard({ match, playerMap, courtNumber, onResult, scoreTarget }) {
  const teamA = match.teamA.map(id => playerMap[id]);
  const teamB = match.teamB.map(id => playerMap[id]);
  const ratingA = teamA.reduce((s, p) => s + p.rating, 0);
  const ratingB = teamB.reduce((s, p) => s + p.rating, 0);
  const [scoreA, setScoreA] = useState('');
  const [scoreB, setScoreB] = useState('');
  const [entering, setEntering] = useState(false);
  const [error, setError] = useState('');

  const courtColors = ['from-green-900 to-green-800', 'from-blue-900 to-blue-800', 'from-purple-900 to-purple-800'];
  const courtIcons = ['🥇', '🥈', '🥉'];

  const done = match.winner !== null;
  const winnerLabel = done ? (match.winner === 'A' ? teamA : teamB).map(p=>p.name).join(' & ') : null;
  const scoreDisplay = done ? `${match.scoreA ?? '—'} – ${match.scoreB ?? '—'}` : null;
  const stoppedEarly = done && Math.max(match.scoreA ?? 0, match.scoreB ?? 0) < scoreTarget;

  const submit = () => {
    const result = validateMatchScore(parseInt(scoreA, 10), parseInt(scoreB, 10), scoreTarget);
    if (!result.ok) { setError(result.error); return; }
    setError('');
    onResult({ winner: result.winner, scoreA: result.scoreA, scoreB: result.scoreB });
    setEntering(false);
  };

  const inputCls = 'w-16 text-center bg-slate-700 border border-slate-500 rounded-lg px-2 py-2 text-white text-xl font-black focus:outline-none focus:border-green-400 focus:ring-1 focus:ring-green-400';

  return (
    <div className={`rounded-2xl overflow-hidden shadow-xl ${done ? 'opacity-80' : ''}`}>
      {/* Header */}
      <div className={`bg-gradient-to-r ${courtColors[courtNumber - 1]} px-5 py-3 flex items-center justify-between`}>
        <div className="flex items-center gap-2">
          <span className="text-xl">{courtIcons[courtNumber - 1]}</span>
          <span className="font-black text-white text-lg">Court {courtNumber}</span>
          {courtNumber === 1 && <span className="badge bg-yellow-500/20 text-yellow-300 ml-1">Elite</span>}
        </div>
        {done && <span className="badge bg-green-500/30 text-green-300">✓ Done</span>}
      </div>

      {/* Court surface */}
      <div className="court-gradient p-1">
        <div className="flex items-stretch gap-1 min-h-[120px]">
          {/* Team A */}
          <div className={`flex-1 rounded-l-xl p-2 sm:p-4 flex flex-col justify-center bg-black/20 ${match.winner === 'A' ? 'ring-2 ring-yellow-400' : ''}`}>
            <div className="text-xs text-green-300 font-bold mb-2 uppercase tracking-widest">Team A</div>
            {teamA.map(p => (
              <div key={p.id} className="mb-1">
                <span className="font-bold text-white text-sm block">{p.name}</span>
                <StarRating value={p.rating} size="sm" />
              </div>
            ))}
            <div className="mt-2 flex items-center gap-3 text-xs text-green-300">
              <span>Rtg: <span className="font-bold text-white">{ratingA}</span></span>
              {teamA[0].roundsPlayed > 0 && (
                <span>Win%: <span className="font-bold text-amber-300">{Math.round(teamA[0].wins/teamA[0].roundsPlayed*100)}%</span></span>
              )}
            </div>
          </div>

          {/* VS / Score display */}
          <div className="flex flex-col items-center justify-center px-2 py-4 gap-1">
            {done ? (
              <div className="text-center">
                <div className="text-white font-black text-lg leading-none">{match.scoreA}</div>
                <div className="text-slate-400 text-xs">–</div>
                <div className="text-white font-black text-lg leading-none">{match.scoreB}</div>
              </div>
            ) : (
              <div className="bg-white/10 rounded-full w-8 h-8 flex items-center justify-center text-white font-black text-xs">VS</div>
            )}
          </div>

          {/* Team B */}
          <div className={`flex-1 rounded-r-xl p-2 sm:p-4 flex flex-col justify-center bg-black/20 ${match.winner === 'B' ? 'ring-2 ring-yellow-400' : ''}`}>
            <div className="text-xs text-green-300 font-bold mb-2 uppercase tracking-widest">Team B</div>
            {teamB.map(p => (
              <div key={p.id} className="mb-1">
                <span className="font-bold text-white text-sm block">{p.name}</span>
                <StarRating value={p.rating} size="sm" />
              </div>
            ))}
            <div className="mt-2 flex items-center gap-3 text-xs text-green-300">
              <span>Rtg: <span className="font-bold text-white">{ratingB}</span></span>
              {teamB[0].roundsPlayed > 0 && (
                <span>Win%: <span className="font-bold text-amber-300">{Math.round(teamB[0].wins/teamB[0].roundsPlayed*100)}%</span></span>
              )}
            </div>
          </div>
        </div>
      </div>

      {/* Result Area */}
      <div className="bg-slate-800 px-4 py-3">
        {done ? (
          <div className="text-center text-sm text-green-400 font-semibold py-1">

function Leaderboard({ playerMap, roundNum }) {
  const ranked = useMemo(() =>
    Object.values(playerMap).sort((a, b) =>
      b.sessionPoints - a.sessionPoints || b.wins - a.wins
    ),
    [playerMap]
  );

  const medals = ['🥇','🥈','🥉'];

  return (
    <div className="glass rounded-2xl overflow-hidden">
      <div className="bg-gradient-to-r from-amber-900/50 to-orange-900/50 px-4 py-3 flex items-center justify-between">
        <h3 className="font-black text-amber-300 flex items-center gap-2"><span>🏆</span> Leaderboard</h3>
        <span className="text-xs text-slate-400">By points</span>
      </div>
      <div className="divide-y divide-slate-700/50 max-h-[500px] overflow-y-auto scrollbar-thin">
        {ranked.map((p, i) => {
          const winPct = p.roundsPlayed > 0 ? Math.round(p.wins / p.roundsPlayed * 100) : null;
          const diff = (p.pointsScored ?? 0) - (p.pointsAgainst ?? 0);
          return (
            <div key={p.id} className={`px-4 py-3 flex items-center gap-3 ${i === 0 ? 'bg-amber-500/10' : ''}`}>
              <span className="text-lg w-6 text-center flex-shrink-0">
                {i < 3 ? medals[i] : <span className="text-slate-500 text-sm font-bold">{i+1}</span>}
              </span>
              <div className="flex-1 min-w-0">
                <div className="font-bold text-white truncate">{p.name}</div>
                <div className="flex flex-wrap items-center gap-x-2 gap-y-0.5 mt-0.5">
                  <StarRating value={p.rating} size="sm" />
                  <span className="text-slate-500 text-xs">{p.wins}W/{p.roundsPlayed}G</span>
                  {winPct !== null && (
                    <span className={`text-xs font-semibold ${winPct >= 50 ? 'text-green-400' : 'text-slate-400'}`}>{winPct}%</span>
                  )}
                  {p.roundsPlayed > 0 && (
                    <span className={`text-xs font-semibold ${diff >= 0 ? 'text-blue-400' : 'text-red-400'}`}>
                      {diff >= 0 ? '+' : ''}{diff}
                    </span>
                  )}
                </div>
              </div>
              <div className="text-right flex-shrink-0">
                <div className="text-xl font-black text-green-400">{p.sessionPoints}</div>
                <div className="text-xs text-slate-500">pts</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── Persistence helpers ─────────────────────────────────────────────────────
const AUTH_KEY = 'badminton_auth_v1';
function loadAuth() {
  try { return JSON.parse(sessionStorage.getItem(AUTH_KEY) || 'null'); } catch(e) { return null; }
}
function saveAuth(auth) {
  try { sessionStorage.setItem(AUTH_KEY, JSON.stringify(auth)); } catch(e) {}
}
function clearAuth() {
  try { sessionStorage.removeItem(AUTH_KEY); } catch(e) {}
}

async function api(path, { method = 'GET', token, body } = {}) {
  const res = await fetch(path, {
    method,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({ ok: false, error: 'Server error' }));
  return { status: res.status, data };
}

function sessionPlayerFromRoster(r) {
  return {
    id: r.id,
    name: r.name,
    rating: r.rating,
    active: true,
    sessionPoints: 0,
    wins: 0,
    roundsPlayed: 0,
    roundsOnBench: 0,
    pointsScored: 0,
    pointsAgainst: 0,
  };
}

function Login({ onLoggedIn }) {
  const [name, setName] = useState('');
  const [pin, setPin] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setBusy(true);
    setError('');
    try {
      const { data } = await api('/api/login', { method: 'POST', body: { name, pin } });
      if (!data.ok) { setError(data.error || 'Login failed'); setBusy(false); return; }
      onLoggedIn({ token: data.token, name: data.name });
    } catch (err) {
      setError('Cannot reach the club server. Use node server.js and open the printed URL.');
      setBusy(false);
    }
  };

  return (
    <div className="min-h-screen text-white p-4 md:p-8 flex items-center justify-center">
      <form onSubmit={submit} className="w-full max-w-md space-y-6">
        <div className="text-center">
          <div className="text-5xl mb-3">🏸</div>
          <h1 className="text-4xl font-black tracking-tight text-green-400">BadmintonPro</h1>
          <p className="text-slate-400 mt-2">Club login · men's doubles</p>
        </div>
        <div className="glass rounded-2xl p-6 space-y-4">
          <div>
            <div className="text-sm text-slate-400 mb-1">Your name</div>

          </div>
          <div>
            <div className="text-sm text-slate-400 mb-1">Club PIN</div>

// ─── Manage Players Modal ────────────────────────────────────────────────────
function ManagePlayersModal({ playerMap, onUpdate, onRoster, onClose }) {

  const [newName, setNewName] = React.useState('');
  const [newRating, setNewRating] = React.useState(3);

  const toggle = (id) => {
    onUpdate(prev => ({ ...prev, [id]: { ...prev[id], active: prev[id].active === false ? true : false } }));
  };

  const addNew = async () => {
    if (!newName.trim()) return;
    const result = await onRoster({ action: 'add', name: newName.trim(), rating: newRating });
    if (!result || !result.ok) return;
    const saved = result.player;
    onUpdate(prev => ({
      ...prev,
      [saved.id]: sessionPlayerFromRoster(saved),
    }));
    setNewName('');
    setNewRating(3);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{background:'rgba(0,0,0,0.7)'}}>

          <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">Add New Player</div>
          <input
            value={newName} onChange={e => setNewName(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && addNew()}

            className="w-full bg-slate-700 border border-slate-600 rounded-xl px-3 py-2 text-white text-sm placeholder-slate-400 focus:outline-none focus:border-green-500"

// ─── Session Screen ──────────────────────────────────────────────────────────
function Session({ courtCount, scoreTarget, playerMap, rounds, currentRound, roundNum, onPatch, onRoster, onEnd, userName, online, onLogout }) {
  const [showManage, setShowManage] = useState(false);

  const allMatchesDone = currentRound && currentRound.matches.every(m => m.winner !== null);

  const recordResult = (courtIndex, { winner, scoreA, scoreB }) => {
    onPatch(s => ({
      currentRound: {
        ...s.currentRound,
        matches: s.currentRound.matches.map(m => m.courtIndex === courtIndex ? { ...m, winner, scoreA, scoreB } : m)
      }
    }));
  };

  const nextRound = () => {
    const updated = applyResults(playerMap, currentRound);
    const next = generateRound(updated, currentRound, courtCount, false, [...rounds, currentRound]);
    onPatch({
      playerMap: updated,
      rounds: [...rounds, currentRound],
      currentRound: next,
      roundNum: roundNum + 1,
    });
  };

  const endSession = () => {
    const final = applyResults(playerMap, currentRound);
    onEnd(final, rounds.length + 1);
  };

  if (!currentRound || !playerMap) return <div className="text-white p-8 text-center">Loading...</div>;

  const benchPlayers = currentRound.bench.map(id => playerMap[id]).filter(Boolean);
  const inactivePlayers = Object.values(playerMap).filter(p => p.active === false);

  return (
    <div className="min-h-screen text-white p-4 md:p-6">
      {showManage && (
        <ManagePlayersModal
          playerMap={playerMap}
          onRoster={onRoster}
          onUpdate={(updater) => {
            const next = typeof updater === 'function' ? updater(playerMap) : updater;
            onPatch({ playerMap: next });
          }}
          onClose={() => setShowManage(false)}
        />
      )}
      {/* Header */}
      <div className="flex items-center justify-between mb-6 max-w-6xl mx-auto">
        <div>
          <div className="flex items-center gap-3">
            <span className="text-3xl">🏸</span>
            <h1 className="text-2xl font-black text-green-400">BadmintonPro</h1>
          </div>
          <div className="text-slate-400 text-sm mt-1">Men's Doubles · to {scoreTarget} · Round {roundNum} · {courtCount} Court{courtCount > 1 ? 's' : ''} · {Object.keys(playerMap).length} Players</div>
          <div className="text-slate-500 text-xs mt-1">{userName} · online {online.join(', ') || 'you'} · <button type="button" onClick={onLogout} className="underline">Log out</button></div>
        </div>
        <div className="flex gap-2">
          {allMatchesDone && (
            <button onClick={nextRound}
              className="bg-green-500 hover:bg-green-400 text-white font-bold py-2 px-5 rounded-xl text-sm transition-all active:scale-95 shadow-lg shadow-green-500/30">
              Next Round →
            </button>
          )}
          <button onClick={() => setShowManage(true)}
            className="bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold py-2 px-4 rounded-xl text-sm transition-all">
            👥
          </button>
          <button onClick={endSession}
            className="bg-slate-600 hover:bg-slate-500 text-slate-200 font-bold py-2 px-4 rounded-xl text-sm transition-all">
            End Session
          </button>
        </div>
      </div>

      <div className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        {/* Courts + Bench */}
        <div className="lg:col-span-2 space-y-4">
          {/* Adaptive mode banner */}
          {roundNum > 1 && (
            <div className="glass rounded-xl px-4 py-2.5 flex items-center gap-2 text-sm">
              <span className="text-amber-400">⚡</span>
              <span className="text-slate-300"><strong className="text-amber-300">Adaptive Mode</strong> — top performers on Court 1 face tougher competition</span>
            </div>
          )}

          {/* Courts */}
          {currentRound.matches.map(match => (
            <CourtCard
              key={`${roundNum}-${match.courtIndex}`}
              match={match}
              playerMap={playerMap}
              courtNumber={match.courtIndex + 1}
              onResult={(result) => recordResult(match.courtIndex, result)}
              scoreTarget={scoreTarget}
            />
          ))}

          {/* Bench */}
          {benchPlayers.length > 0 && (
            <div className="glass rounded-2xl p-4">
              <h3 className="font-bold text-slate-300 mb-3 flex items-center gap-2">
                <span>⏳</span> Sitting Out This Round
              </h3>
              <div className="flex flex-wrap gap-2">
                {benchPlayers.map(p => (
                  <div key={p.id} className="bg-slate-700 rounded-xl px-3 py-2 flex items-center gap-2">
                    <span className="font-semibold text-sm">{p.name}</span>
                    <StarRating value={p.rating} size="sm" />
                    <span className="text-green-400 font-bold text-sm">{p.sessionPoints}pt</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Taking a break */}
          {inactivePlayers.length > 0 && (
            <div className="glass rounded-2xl p-4">
              <h3 className="font-bold text-slate-400 mb-3 flex items-center gap-2 text-sm">
                <span>⏸</span> Taking a Break

              <div className="flex flex-wrap gap-2">
                {inactivePlayers.map(p => (
                  <div key={p.id} className="bg-slate-800 rounded-xl px-3 py-2 flex items-center gap-2 opacity-60">

                    <span className="text-slate-500 font-bold text-sm">{p.sessionPoints}pt</span>
                  </div>

              </div>

          {allMatchesDone && (
            <div className="glass rounded-2xl p-5 text-center border border-green-500/30">
              <div className="text-2xl mb-2">✅</div>
              <p className="text-green-400 font-bold mb-1">All matches complete!</p>
              <p className="text-slate-400 text-sm mb-4">Leaderboard updated. Generate next round or end session.</p>
              <button onClick={nextRound}
                className="bg-green-500 hover:bg-green-400 text-white font-bold py-3 px-8 rounded-xl transition-all active:scale-95 shadow-lg shadow-green-500/30">
                Generate Round {roundNum + 1} →
              </button>
            </div>
          )}
        </div>

        {/* Sidebar */}
        <div className="space-y-4">
          <Leaderboard playerMap={playerMap} roundNum={roundNum} />

          {/* Point key */}
          <div className="glass rounded-2xl p-4 text-xs text-slate-400 space-y-1.5">
            <div className="font-bold text-slate-300 mb-2">Point System</div>
            <div className="flex justify-between"><span>🏆 Win (equal/lower rated)</span><span className="text-green-400 font-bold">+2 pts</span></div>
            <div className="flex justify-between"><span>⚡ Upset win</span><span className="text-yellow-400 font-bold">+3 pts</span></div>
            <div className="flex justify-between"><span>📊 Margin bonus (per 5 pts)</span><span className="text-purple-400 font-bold">+1 pt</span></div>
            <div className="flex justify-between"><span>🎯 Participation</span><span className="text-blue-400 font-bold">+1 pt</span></div>
            <div className="flex justify-between"><span>⏳ Bench round</span><span className="text-slate-500 font-bold">+0 pts</span></div>
            <div className="border-t border-slate-700 mt-2 pt-2 text-slate-500">
              Stopped early: leader wins · session points use the recorded score (including margin)
            </div>
            <div className="text-slate-500">
              Round 2+: matchups use pts + win% + score diff
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── App Root ────────────────────────────────────────────────────────────────
function App() {
  const [auth, setAuth] = useState(() => loadAuth());
  const [snap, setSnap] = useState(null);
  const [roster, setRoster] = useState([]);
  const [online, setOnline] = useState([]);
  const snapRef = useRef(null);
  const patchQueue = useRef(Promise.resolve());
  useEffect(() => { snapRef.current = snap; }, [snap]);

  const logout = () => {
    clearAuth();
    setAuth(null);
    setSnap(null);
  };

  const applyServer = (data) => {
    if (data && data.state) {
      setSnap(data.state);
      snapRef.current = data.state;
    }
    if (data && data.roster) setRoster(data.roster);
    if (data && data.online) setOnline(data.online);
  };

  useEffect(() => {
    if (!auth) return;
    let cancelled = false;
    const pull = async () => {
      const { status, data } = await api('/api/state', { token: auth.token });
      if (cancelled) return;
      if (status === 401) { logout(); return; }
      if (data.state && snapRef.current && data.state.rev < snapRef.current.rev) return;
      applyServer(data);
    };
    pull();
    const id = setInterval(pull, 2000);
    return () => { cancelled = true; clearInterval(id); };
  }, [auth && auth.token]);

  const onLoggedIn = (next) => {
    saveAuth(next);
    setAuth(next);
  };

  const onRoster = async (body) => {
    if (!auth) return null;
    const { status, data } = await api('/api/roster', { method: 'POST', token: auth.token, body });
    if (status === 401) { logout(); return null; }
    if (data.roster) setRoster(data.roster);
    if (data.online) setOnline(data.online);
    return data;
  };

  const onPatch = (partialOrFn) => {
    if (!auth) return;
    patchQueue.current = patchQueue.current.then(async () => {
      const base = snapRef.current;
      if (!base) return;
      const partial = typeof partialOrFn === 'function' ? partialOrFn(base) : partialOrFn;
      const { status, data } = await api('/api/state', {
        method: 'PUT',
        token: auth.token,
        body: { ...base, ...partial, rev: base.rev },
      });
      if (status === 401) { logout(); return; }
      applyServer(data);
    }).catch(() => {});
  };

  const handleStart = () => {
    onPatch(s => {
      const m = {};
      (s.players || []).forEach(p => { m[p.id] = p; });
      return {
        screen: 'session',
        playerMap: m,
        rounds: [],
        currentRound: generateRound(m, null, s.courts, true, []),
        roundNum: 1,
      };
    });
  };

  const handleEnd = (finalMap, roundsPlayed) => {
    onPatch({ screen: 'summary', finalMap, roundsPlayed, playerMap: finalMap });
  };

  const handleRestart = async () => {
    if (!auth) return;
    const { status, data } = await api('/api/reset', { method: 'POST', token: auth.token });
    if (status === 401) { logout(); return; }
    applyServer(data);
  };

  if (!auth) return <Login onLoggedIn={onLoggedIn} />;
  if (!snap) return <div className="min-h-screen text-white p-8 text-center">Loading club session…</div>;

  if (snap.screen === 'setup') return (
    <Setup
      courts={snap.courts}
      scoreTarget={snap.scoreTarget}
      players={snap.players || []}
      roster={roster}
      onPatch={onPatch}
      onRoster={onRoster}
      onStart={handleStart}
      userName={auth.name}
      online={online}
      onLogout={logout}
    />
  );
  if (snap.screen === 'session') return (
    <Session
      courtCount={snap.courts}
      scoreTarget={snap.scoreTarget}
      playerMap={snap.playerMap}
      rounds={snap.rounds || []}
      currentRound={snap.currentRound}
      roundNum={snap.roundNum}
      onPatch={onPatch}
      onRoster={onRoster}
      onEnd={handleEnd}
      userName={auth.name}
      online={online}
      onLogout={logout}
    />
  );
  if (snap.screen === 'summary' && snap.finalMap) return (
    <Summary
      playerMap={snap.finalMap}
      roundsPlayed={snap.roundsPlayed}
      onRestart={handleRestart}
    />
  );
  return <Setup courts={snap.courts} scoreTarget={snap.scoreTarget} players={snap.players || []} roster={roster} onPatch={onPatch} onRoster={onRoster} onStart={handleStart} userName={auth.name} online={online} onLogout={logout} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js'));
  }
</script>
</body>
</html>
